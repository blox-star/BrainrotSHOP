<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Brainrots</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 4rem;
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
        }
        .button {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            color: white;
            background-color: #1a73e8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
            margin-bottom: 2rem;
        }
        .button:hover {
            background-color: #1557b0;
        }
        .rainbow-text {
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(
                to right,
                red,
                orange,
                yellow,
                green,
                blue,
                indigo,
                violet
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Tienda de Brainrots</h1>
    <a href="https://www.roblox.com/share?code=b8f050d469e5cb4abaf62b55cb99f275&type=Server" class="button">Ver tienda!</a>
    <p class="rainbow-text">Vende y compro brainrots por robux o pesos mexicanos!</p>
</body>
</html>
